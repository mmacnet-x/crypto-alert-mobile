[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-alert"
version = "0.1.0"
description = "업비트/바이낸스 차트 분석 알림 프로그램 (Windows)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.7",
    "pyqtgraph>=0.13",
    "pandas>=2.2",
    "numpy>=2.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.6",
    "pyinstaller>=6.0",
]

[project.scripts]
crypto-alert = "crypto_alert.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
