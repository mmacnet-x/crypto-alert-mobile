name: crypto_alert_mobile
description: "업비트/바이낸스/OKX 차트 분석 및 24시간 실시간 시세 알림 모바일 앱 (Android APK)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  flutter_local_notifications: ^17.0.0
  flutter_foreground_task: ^6.1.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  audioplayers: ^6.0.0
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/watchlist.json
    - assets/supplies.json
